<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect width="720" height="520" rx="8" fill="#ffffff"/>

  <!-- 상단 타이틀 -->
  <text x="360" y="36" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1e293b">SAPD Framework</text>
  <text x="360" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">State-based Adaptive Policy Design</text>

  <!-- ===== 이론층 영역 ===== -->
  <rect x="30" y="75" width="660" height="250" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="52" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.05em">이론층 — Adaptive Policy Design</text>

  <!-- State(t) 노드 -->
  <rect x="60" y="130" width="140" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="130" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1e40af">State(t)</text>
  <text x="130" y="174" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#3b82f6">현재 상태 데이터</text>

  <!-- 화살표: State(t) → Decision -->
  <line x1="200" y1="160" x2="258" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision 노드 -->
  <rect x="260" y="120" width="200" height="80" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="360" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#166534">Decision(t)</text>
  <text x="360" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#16a34a">= f(State(t))</text>
  <text x="360" y="186" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#4ade80">상태 기반 적응형 의사결정</text>

  <!-- 화살표: Decision → System Response -->
  <line x1="460" y1="160" x2="518" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- System Response 노드 -->
  <rect x="520" y="130" width="140" height="60" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
  <text x="590" y="153" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#92400e">System</text>
  <text x="590" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#92400e">Response</text>
  <text x="590" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#b45309">정책 시행 결과</text>

  <!-- 피드백 루프: System Response → State(t+1) -->
  <path d="M 590 190 L 590 260 L 130 260 L 130 230" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="6,3"/>

  <!-- State(t+1) 노드 (작은 라벨) -->
  <rect x="80" y="230" width="100" height="36" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="130" y="253" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e40af">State(t+1)</text>

  <!-- 피드백 루프 라벨 -->
  <text x="360" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8">피드백 루프 — 실시간 상태 갱신</text>

  <!-- 연결선: 이론층 → 실무층 -->
  <line x1="360" y1="325" x2="360" y2="350" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="380" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#3b82f6">검증 순환</text>

  <!-- ===== 실무층 영역 ===== -->
  <rect x="30" y="355" width="660" height="140" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="52" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#7c3aed" letter-spacing="0.05em">실무층 — SAPD Validation Module</text>

  <!-- 검증 카드 3개 -->
  <rect x="60" y="395" width="190" height="80" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="155" y="418" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6d28d9">분석 결과 타당성 검증</text>
  <text x="155" y="436" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#8b5cf6">AI 분석 결과의 정확성,</text>
  <text x="155" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#8b5cf6">신뢰도, 재현 가능성 평가</text>

  <rect x="265" y="395" width="190" height="80" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="360" y="418" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6d28d9">시스템 설계 타당성 검증</text>
  <text x="360" y="436" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#8b5cf6">설계 구조의 검증 가능성,</text>
  <text x="360" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#8b5cf6">로직 투명성, 감사 가능성</text>

  <rect x="470" y="395" width="190" height="80" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="565" y="418" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6d28d9">설명가능성 진단</text>
  <text x="565" y="436" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#8b5cf6">검토 체크리스트,</text>
  <text x="565" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#8b5cf6">평가 루브릭, 위험 분류</text>

  <!-- 실무층 → 이론층 피드백 (우측) -->
  <path d="M 690 425 L 705 425 L 705 200 L 690 200" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)" stroke-dasharray="4,3"/>
  <text x="712" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#3b82f6" transform="rotate(90, 712, 320)">검증 결과 반영</text>
</svg>
